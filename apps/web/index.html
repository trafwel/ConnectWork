<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connectwork</title>
    <!-- Step S: apply the saved style/mode BEFORE the app loads, so a reload never flashes
         the wrong theme. Mirrors parseAppearance/applyAppearance in src/lib/appearance.ts. -->
    <script>
      try {
        var a = JSON.parse(localStorage.getItem('cw-appearance') || '{}');
        var dark = a.mode === 'dark' || (a.mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.style = a.style === 'atlas' ? 'atlas' : 'neutral';
        document.documentElement.dataset.reminders = a.reminders === 'ripple' ? 'ripple' : 'flag';
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
    <!--
      Step T (Atlas theme): add IBM Plex fonts here, e.g.
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
      M11 (Google Calendar): the sign-in script is NOT loaded here; lib/googleCalendar.ts adds it on the
      first "Connect Google Calendar" click, so people who never connect never download Google code.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
