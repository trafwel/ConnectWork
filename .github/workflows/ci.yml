# CI: the same checks we run locally, on every pull request (any base branch, so stacked
# milestone PRs get checks too) and on every push to main.
# No secrets are used: tests never call Gemini (routes get a fake `generate`).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install (exactly the lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
